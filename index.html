<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - UNiTie Tableau</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 124 100'%3E%3Cg fill='%23ff444f'%3E%3Cpath d='M0 100V73Q0 68 5 68H19Q24 68 24 73V100Z'/%3E%3Cpath d='M33 100V51Q33 46 38 46H52Q57 46 57 51V100Z'/%3E%3Cpath d='M67 100V29Q67 24 72 24H86Q91 24 91 29V100Z'/%3E%3C/g%3E%3Cpath d='M100 100V6Q100 1 105 1H119Q124 1 124 6V100Z' fill='%23b3b3b3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15181d;
    --red: #ff444f;
    --grey: #b0b0b0;
    /* 1 unité = 1px sur la capture d'origine (1920 x 955), mise à l'échelle selon l'écran */
    --u: min(calc(100vw / 1920), calc(100vh / 955));
  }

  @media (max-width: 900px) {
    :root { --u: calc(100vw / 1000); }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    overflow-x: hidden;
    font-family: 'Montserrat', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    color: var(--grey);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    width: 100%;
    height: calc(955 * var(--u));
  }

  .stage > * {
    position: absolute;
    left: 50%;
    white-space: pre;
    line-height: 1;
    text-align: center;
  }

  .logo {
    top: calc(98 * var(--u));
    width: calc(124 * var(--u));
    height: calc(100 * var(--u));
    transform: translateX(-50%);
  }
  .logo svg { display: block; width: 100%; height: 100%; }

  .error {
    top: calc(272 * var(--u));
    left: calc(50% - 22 * var(--u));
    transform: translateX(-50%);
    font-size: calc(83 * var(--u));
    font-weight: 800;
  }

  .code {
    top: calc(350 * var(--u));
    left: calc(50% - 22 * var(--u));
    transform: translateX(-50%);
    font-size: calc(281 * var(--u));
    font-weight: 800;
    color: var(--red);
  }

  .not-found {
    top: calc(628 * var(--u));
    left: calc(50% - 22 * var(--u));
    transform: translateX(-50%);
    font-size: calc(78 * var(--u));
    font-weight: 800;
  }

  .tagline {
    top: calc(834 * var(--u));
    left: calc(50% - 46 * var(--u));
    transform: translateX(-50%);
    font-size: calc(28 * var(--u));
    font-weight: 500;
  }

  .status {
    top: calc(874 * var(--u));
    left: calc(50% - 53 * var(--u));
    transform: translateX(-50%);
    font-size: calc(18 * var(--u));
    font-weight: 500;
  }
</style>
</head>
<body>

  <main class="stage">
    <div class="logo" role="img" aria-label="UNiTie Tableau">
      <svg viewBox="0 0 124 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="#ff444f">
          <path d="M0 100V73Q0 68 5 68H19Q24 68 24 73V100Z"/>
          <path d="M33 100V51Q33 46 38 46H52Q57 46 57 51V100Z"/>
          <path d="M67 100V29Q67 24 72 24H86Q91 24 91 29V100Z"/>
        </g>
        <path d="M100 100V6Q100 1 105 1H119Q124 1 124 6V100Z" fill="#b3b3b3"/>
      </svg>
    </div>

    <p class="error">ERROR</p>
    <h1 class="code">404 !</h1>
    <p class="not-found">NOT FOUND</p>

    <p class="tagline">suivi du performance uniquement sur deriv</p>
    <p class="status">UNITIE TABLEAU FERMER</p>
  </main>

</body>
</html>
